name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  CARGO_NDK_VERSION: "4.1.2"
  RUST_VERSION: "1.89.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup keep checkout
        uses: ./.github/actions/setup-keep

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify toolchain version pins are consistent
        run: ./scripts/check-toolchain-pins.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: keep

      - name: Cache Rust build outputs
        id: cache-rust-outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/kotlin/io/privkey/keep/uniffi
          key: rust-outputs-${{ runner.os }}-aarch64-linux-android-ndk${{ env.NDK_VERSION }}-rust${{ env.RUST_VERSION }}-ndkcargo${{ env.CARGO_NDK_VERSION }}-keep${{ hashFiles('keep.version') }}-lock${{ hashFiles('keep/Cargo.lock') }}-scripts${{ hashFiles('build-rust.sh', 'scripts/**/*.sh') }}

      - name: Install cargo-ndk
        if: steps.cache-rust-outputs.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cf39a74df4a72510be4e5b63348d61067f11e64a # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Build native libraries
        if: steps.cache-rust-outputs.outputs.cache-hit != 'true'
        run: ./build-rust.sh
        env:
          KEEP_REPO: ${{ github.workspace }}/keep
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TARGETS: aarch64-linux-android
          AWS_LC_SYS_CMAKE_BUILDER: "1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

  instrumented-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup keep checkout
        uses: ./.github/actions/setup-keep

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify toolchain version pins are consistent
        run: ./scripts/check-toolchain-pins.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: keep

      - name: Cache Rust build outputs
        id: cache-rust-outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/kotlin/io/privkey/keep/uniffi
          key: rust-outputs-${{ runner.os }}-x86_64-linux-android-ndk${{ env.NDK_VERSION }}-rust${{ env.RUST_VERSION }}-ndkcargo${{ env.CARGO_NDK_VERSION }}-keep${{ hashFiles('keep.version') }}-lock${{ hashFiles('keep/Cargo.lock') }}-scripts${{ hashFiles('build-rust.sh', 'scripts/**/*.sh') }}

      - name: Install cargo-ndk
        if: steps.cache-rust-outputs.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cf39a74df4a72510be4e5b63348d61067f11e64a # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Build native libraries
        if: steps.cache-rust-outputs.outputs.cache-hit != 'true'
        run: ./build-rust.sh
        env:
          KEEP_REPO: ${{ github.workspace }}/keep
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TARGETS: x86_64-linux-android
          AWS_LC_SYS_CMAKE_BUILDER: "1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --no-daemon
