Categories:
  - Security
License: MIT
AuthorName: PrivKey LLC
AuthorEmail: kyle@privkey.io
WebSite: https://privkey.io
SourceCode: https://github.com/privkeyio/keep-android
IssueTracker: https://github.com/privkeyio/keep-android/issues
Changelog: https://github.com/privkeyio/keep-android/releases

RepoType: git
Repo: https://github.com/privkeyio/keep-android

Binaries: https://github.com/privkeyio/keep-android/releases/download/v%v/keep-android-v%v.apk

Builds:
  - versionName: 1.0.0
    versionCode: 12
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends pkg-config cmake make gcc g++ libc6-dev curl ca-certificates
      - curl --proto '=https' --tlsv1.2 -fsSL https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init -o /tmp/rustup-init
      - echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum -c -
      - chmod +x /tmp/rustup-init
      - /tmp/rustup-init -y --default-toolchain 1.89.0 --profile minimal --no-modify-path
    ndk: r29
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install --locked --version 4.1.2 cargo-ndk
      - KEEP_SHA="$(tr -d '[:space:]' < keep.version)"
      - git clone https://github.com/privkeyio/keep.git ../keep
      - git -C ../keep checkout "$KEEP_SHA"
      - rm -rf keep
      - ln -sfn ../keep keep
      - export KEEP_REPO="$(pwd)/../keep"
      - export AWS_LC_SYS_CMAKE_BUILDER=1
      - export SOURCE_DATE_EPOCH="$(./scripts/derive-sde.sh)"
      - ./build-rust.sh
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 12
